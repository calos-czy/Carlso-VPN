<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动画静态网页示例</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        /* 导航栏样式 */
        nav {
            background-color: #2c3e50;
            padding: 1rem 5%;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            /* 导航栏入场动画 */
            animation: slideDown 0.8s ease forwards;
            opacity: 0;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: #3498db;
            transform: translateY(-2px);
        }

        /* 英雄区样式 */
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            text-align: center;
            padding: 0 5%;
            margin-top: -70px; /* 抵消固定导航栏高度 */
        }

        .hero-content {
            /* 英雄区内容入场动画 */
            animation: fadeInUp 1s ease 0.5s forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: white;
            color: #3498db;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            background-color: #f8f9fa;
        }

        /* 特色区块样式 */
        .features {
            padding: 5rem 5%;
            background-color: white;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            color: #2c3e50;
        }

        .features-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .feature-card {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.4s ease;
            /* 初始状态，滚动时触发动画 */
            opacity: 0;
            transform: translateY(50px);
        }

        .feature-card.animate {
            animation: fadeInUp 0.8s ease forwards;
        }

        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        .feature-icon {
            font-size: 3rem;
            color: #3498db;
            margin-bottom: 1.5rem;
        }

        .feature-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        /* 页脚样式 */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 0;
            margin-top: 3rem;
        }

        /* 动画关键帧定义 */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            
            .section-title {
                font-size: 2rem;
            }
            
            .nav-links {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-container">
            <div class="logo">AnimateWeb</div>
            <div class="nav-links">
                <a href="#home">首页</a>
                <a href="#features">特色</a>
                <a href="#contact">联系我们</a>
            </div>
        </div>
    </nav>

    <!-- 英雄区 -->
    <section class="hero" id="home">
        <div class="hero-content">
            <h1>炫酷动画静态网页</h1>
            <p>这是一个包含多种CSS动画效果的静态网页示例，包含入场动画、悬停动画和滚动触发动画，适配各种设备尺寸。</p>
            <a href="#features" class="btn">查看特色</a>
        </div>
    </section>

    <!-- 特色区块 -->
    <section class="features" id="features">
        <h2 class="section-title">动画特色</h2>
        <div class="features-container">
            <div class="feature-card">
                <div class="feature-icon">✨</div>
                <h3>入场动画</h3>
                <p>页面元素加载时的渐入和滑入效果，提升用户第一印象，让页面更有层次感。</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🎯</div>
                <h3>悬停交互</h3>
                <p>按钮和卡片的悬停动效，提供即时的视觉反馈，增强用户交互体验。</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📱</div>
                <h3>响应式设计</h3>
                <p>适配手机、平板和桌面设备，保证在各种屏幕尺寸下动画效果正常展示。</p>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer id="contact">
        <p>© 2025 AnimateWeb - 炫酷动画静态网页示例</p>
    </footer>

    <script>
        // 滚动触发动画
        document.addEventListener('DOMContentLoaded', function() {
            // 获取所有需要动画的卡片
            const cards = document.querySelectorAll('.feature-card');
            
            // 监听滚动事件
            window.addEventListener('scroll', function() {
                cards.forEach(card => {
                    // 获取卡片位置信息
                    const cardTop = card.getBoundingClientRect().top;
                    const windowHeight = window.innerHeight;
                    
                    // 当卡片进入视口时添加动画类
                    if (cardTop < windowHeight * 0.85) {
                        card.classList.add('animate');
                    }
                });
            });
            
            // 初始触发一次，确保首屏内容能显示动画
            window.dispatchEvent(new Event('scroll'));
        });
    </script>
</body>
</html>
